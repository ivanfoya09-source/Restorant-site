{% extends 'base.html' %}

{% block content %}

<div class="auth-page">

    <form method="POST" class="auth-card">
        {{ form.hidden_tag() }}

        <h2>👋 Вхід</h2>

        <p>Логін</p>
        {{ form.username(class="auth-input") }}

        <p>Пароль</p>
        {{ form.password(class="auth-input") }}

        {{ form.submit(class="btn") }}

        <p class="auth-link">
            Немає акаунта?
            <a href="{{ url_for('sign_up') }}">Реєстрація</a>
        </p>

    </form>

</div>

{% endblock %}
