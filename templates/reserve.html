{% extends 'base.html' %}

{% block content %}

<div class="reserve-box">

    <h2>🍽 Бронювання столу</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <p>Дата і час</p>
        {{ form.time(type="datetime-local", required=True) }}

        {{ form.table(id="table-input") }}

        <p>Оберіть столик</p>

        <div class="restaurant-map">
            {% for i in range(1, 13) %}
                <div class="table" onclick="selectTable('{{ i }}', this)">
                    {{ i }}
                </div>
            {% endfor %}
        </div>

        <p id="selected-table-text">Не обрано</p>

        <button type="submit" class="btn">Забронювати</button>
    </form>

</div>

<script>
function selectTable(id, el) {
    const input = document.getElementById("table-input");

    input.value = id;

    document.querySelectorAll(".table").forEach(t => t.classList.remove("active"));
    el.classList.add("active");

    document.getElementById("selected-table-text").innerText = "Обрано столик №" + id;
}

document.querySelector("form").addEventListener("submit", function(e) {
    const time = document.querySelector("input[type='datetime-local']").value;
    const table = document.getElementById("table-input").value;

    if (!time) {
        alert("Оберіть дату і час!");
        e.preventDefault();
        return;
    }

    if (!table) {
        alert("Оберіть столик!");
        e.preventDefault();
        return;
    }
});
</script>

{% endblock %}
